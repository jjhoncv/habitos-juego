<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hábitos</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap" />
    <style>
      :root { --tinta: #1f2a44; --papel: #fff8ec; --sol: #ffc23d; --menta: #3cc9a0; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--papel); color: var(--tinta); font-family: 'Nunito Sans', sans-serif; padding: 16px; box-sizing: border-box; }
      h1 { font-family: 'Baloo 2', sans-serif; font-size: 3rem; margin: 0 0 .25em; }
      .modos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); max-width: 520px; }
      a { display: block; padding: 18px; border-radius: 16px; background: #fff; border: 3px solid var(--tinta); color: inherit; text-decoration: none; box-shadow: 0 5px 0 var(--tinta); }
      a:hover { background: var(--sol); }
      b { font-family: 'Baloo 2', sans-serif; font-size: 1.4rem; display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hábitos</h1>
      <div class="modos">
        <a href="juego.html"><b>Dani, 7 años</b>Capítulo 1: la mañana, el colegio y la tarde.</a>
        <a href="andres.html"><b>Andrés, adulto</b>La mañana antes del trabajo.</a>
      </div>
    </main>
  </body>
</html>
